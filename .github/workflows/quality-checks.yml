name: Radar Comercial - Quality Checks

on:
  push:
    branches: [main, backend/foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Tests and syntax
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar_test
          POSTGRES_DB: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://radar:radar_test@localhost:5432/radar_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Provision isolated least-privilege PostgreSQL roles
        env:
          MIGRATION_DB_PASSWORD: radar_migration_test
          RUNTIME_DB_PASSWORD: radar_runtime_test
        run: psql "$TEST_DATABASE_URL" -v database_name=radar_test -f database/roles/production-roles.sql

      - name: Apply schema using the dedicated migration owner
        env:
          NODE_ENV: production
          MIGRATION_DATABASE_URL: postgres://radar_migration_owner:radar_migration_test@localhost:5432/radar_test
        run: npm run db:migrate

      - name: Run automated tests including PostgreSQL integration
        run: npm test

      - name: Run PostgreSQL-backed API performance baseline
        run: npm run perf

      - name: Create empty database for restore verification
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE radar_restore_test OWNER radar_migration_owner"

      - name: Create ephemeral Ed25519 test keys
        run: |
          openssl genpkey -algorithm ED25519 -out /tmp/radar-ci-signing-private.pem
          openssl pkey -in /tmp/radar-ci-signing-private.pem -pubout -out /tmp/radar-ci-signing-public.pem
      - name: Create and verify signed PostgreSQL backup
        env:
          BACKUP_DATABASE_URL: postgres://radar:radar_test@localhost:5432/radar_test
          BACKUP_FILE: /tmp/radar-ci-backup.dump
        run: |
          export BACKUP_SIGNING_PRIVATE_KEY="$(cat /tmp/radar-ci-signing-private.pem)"
          export BACKUP_REQUIRE_SIGNATURE=true
          npm run db:backup

      - name: Restore signed backup into an empty database
        env:
          RESTORE_DATABASE_URL: postgres://radar_migration_owner:radar_migration_test@localhost:5432/radar_restore_test
          RESTORE_FILE: /tmp/radar-ci-backup.dump
          RESTORE_CONFIRM_DATABASE: radar_restore_test
        run: |
          export BACKUP_SIGNING_PUBLIC_KEY="$(cat /tmp/radar-ci-signing-public.pem)"
          export BACKUP_REQUIRE_SIGNATURE=true
          npm run db:restore
          rm -f /tmp/radar-ci-signing-private.pem /tmp/radar-ci-signing-public.pem

      - name: Reapply runtime privileges after restore
        env:
          NODE_ENV: production
          MIGRATION_DATABASE_URL: postgres://radar_migration_owner:radar_migration_test@localhost:5432/radar_restore_test
        run: npm run db:migrate

      - name: Verify restored schema and migration history
        env:
          RESTORE_DATABASE_URL: postgres://radar:radar_test@localhost:5432/radar_restore_test
        run: |
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) AS restored_migrations FROM schema_migrations"
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) AS restored_tables FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'"

      - name: Validate OpenAPI contract
        run: npm run openapi:lint

      - name: Check JavaScript syntax
        run: npm run check
